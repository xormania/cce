[package]
name = "cce-storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Exposes the fuzzing harness (`fuzz_api`) and the storage simulator it uses. For the fuzz targets
# in `fuzz/`; not part of the storage API.
fuzz-api = []

[dependencies]
cce-core = { path = "../cce-core" }
crc32fast = "1"
sha2 = "0.11"

[[bin]]
name = "storage-driver"
path = "src/bin/storage-driver.rs"

# Structure check of a store: see the binary's documentation for its output and exit status.
[[bin]]
name = "cce-verify"
path = "src/bin/cce-verify.rs"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"
sha2 = "0.11"
