name: testkit

on:
  push:
    branches: ['test-support/**']
  workflow_dispatch:
    inputs:
      original:
        description: Original suite ref (must have the same production inputs)
        default: origin/master
        required: true

permissions:
  contents: read

concurrency:
  group: testkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comparison:
    name: Test suite fault comparison
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Locate flagged additions without printing matches
        env:
          MARKERS: ${{ secrets.PRIVATE_MARKERS }}
          BASE_REF: ${{ inputs.original || 'origin/master' }}
          HEAD_REF: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          def pinned(ref):
              return subprocess.check_output(["git", "rev-parse", "--verify", "--end-of-options", ref + "^{commit}"], text=True).strip()
          base, head = pinned(os.environ["BASE_REF"]), pinned(os.environ["HEAD_REF"])
          diff = subprocess.check_output(["git", "diff", "--text", "--no-ext-diff", "--no-textconv", "--unified=0", base + "..." + head, "--"], text=True)
          additions, locations, path, line = [], [], "", 0
          for row in diff.splitlines():
              if row.startswith("+++ b/"):
                  path = row[6:]
              elif row.startswith("@@ "):
                  line = int(re.search(r"\+(\d+)", row)[1])
              elif row.startswith("+") and not row.startswith("+++"):
                  additions.append(row[1:])
                  locations.append({"path": path, "line": line})
                  line += 1
              elif row.startswith(" "):
                  line += 1
          if not os.environ.get("MARKERS"):
              raise SystemExit("Scan patterns unavailable")
          scan = subprocess.run(["grep", "-nEi", "--", os.environ["MARKERS"]], input="\n".join(additions) + "\n", text=True, capture_output=True)
          if scan.returncode not in (0, 1):
              raise SystemExit("Unable to scan additions")
          print(json.dumps([locations[int(row.split(":", 1)[0]) - 1] for row in scan.stdout.splitlines()]))
          PY
      - name: Tooling controls
        run: python3 -m unittest discover -s tests/ci -v
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Compare healthy suites and calibrated faults
        env:
          ORIGINAL: ${{ inputs.original || 'origin/master' }}
          CANDIDATE: ${{ github.sha }}
        run: |
          python3 tools/testkit/sidebyside.py \
            --original "$ORIGINAL" --candidate "$CANDIDATE" \
            --output "$RUNNER_TEMP/testkit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Retain comparison logs and failure images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testkit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/testkit-*/results.json
            ${{ runner.temp }}/testkit-*/comparison.md
            ${{ runner.temp }}/testkit-*/*.log
            ${{ runner.temp }}/testkit-*/temporary/
          if-no-files-found: warn
          retention-days: 7
