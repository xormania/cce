name: leak-guard
# Starts the trusted leak scan for a pull request. This workflow runs the pull request's own
# definition, so it uses no secrets and produces no `scan` check. When it completes,
# .github/workflows/leak-scan.yml runs from the default branch, reads the pull request as data and
# publishes the required `scan` check (see docs/ci-leak-scan.md).
# Re-runs when the PR text is edited, so the scan sees the current title and body.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: leak-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trigger:
    name: Start trusted leak scan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hand over to the trusted scan
        run: echo "The leak-scan workflow scans this pull request from the default branch's code."
