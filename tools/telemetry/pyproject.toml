[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-telemetry"
version = "0.1.0"
description = "Local JSON observation capture and queries"
requires-python = ">=3.11"

[project.scripts]
telemetry = "agent_telemetry.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_telemetry*"]
